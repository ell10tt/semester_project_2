<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/img/logo-1.svg" />
    <title>Auctions | Bidsy</title>
    <script type="module" src="/js/index.js"></script>
  </head>
  <body data-page="listings">
    <header class="site-header">
      <nav class="site-nav" aria-label="Main navigation">
        <a class="site-nav__brand" href="index.html" aria-label="Bidsy home">
          <img class="site-nav__logo" src="/img/logo-2.svg" alt="Bidsy" />
        </a>

        <div class="site-nav__links">
          <a class="site-nav__link" href="index.html">Home</a>
          <a class="site-nav__link site-nav__link--active" href="listings.html">
            Auctions
          </a>
        </div>

        <div class="site-nav__actions">
          <a
            class="site-nav__account-link"
            href="login.html"
            aria-label="Login"
            data-guest-only
          >
            <i class="bi bi-box-arrow-in-right"></i>
          </a>
          <a
            class="site-nav__account-link"
            href="register.html"
            aria-label="Register"
            data-guest-only
          >
            <i class="bi bi-person-plus"></i>
          </a>
          <span class="site-nav__credit-count" data-auth-only data-user-credits></span>
          <a class="site-nav__create" href="create-listing.html" data-auth-only>
            Create Listing
          </a>
          <button
            class="site-nav__icon-button"
            type="button"
            aria-label="Notifications"
            data-auth-only
          >
            <i class="bi bi-bell"></i>
          </button>
          <a
            class="site-nav__avatar"
            href="profile.html"
            aria-label="Profile"
            data-auth-only
            data-user-avatar
          >
            <i class="bi bi-person-fill"></i>
          </a>
          <button
            class="site-nav__logout-button"
            type="button"
            data-auth-only
            data-logout-button
          >
            Logout
          </button>
        </div>
      </nav>
    </header>

    <main class="listings-page flex-grow-1 px-4 px-lg-5 pt-5 pb-5">
      <h1 class="listings-page__title text-center mb-5">All Auctions</h1>

      <form
        class="listings-page__filters row g-3 align-items-end mx-auto mb-4"
        data-listings-filter-form
      >
        <div class="col-12 col-md">
          <label class="form-label" for="listingSearch">Search</label>
          <input
            class="form-control"
            id="listingSearch"
            type="search"
            placeholder="Search loaded auctions"
            data-listings-search
          />
        </div>

        <div class="col-12 col-md">
          <label class="form-label" for="listingTag">Tag</label>
          <input
            class="form-control"
            id="listingTag"
            type="text"
            placeholder="camera"
            data-listings-tag
          />
        </div>

        <div class="col-12 col-md">
          <label class="form-label" for="listingSort">Sort by</label>
          <select class="form-select" id="listingSort" data-listings-sort>
            <option value="created-desc">Newest</option>
            <option value="endsAt-asc">Ending soon</option>
            <option value="title-asc">Title A-Z</option>
          </select>
        </div>

        <div class="col-12 col-sm-auto">
          <button class="listings-page__filter-button btn" type="submit">Apply</button>
        </div>

        <div class="col-12 col-sm-auto">
          <button
            class="listings-page__clear-button btn"
            type="button"
            data-clear-listing-filters
          >
            Clear
          </button>
        </div>
      </form>

      <div
        class="page-message listings-page__message mx-auto mb-4"
        data-listings-message
      ></div>
      <section
        class="listings-grid row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4"
        data-listings-container
        aria-label="Auction listings"
      ></section>

      <div class="text-center mt-5">
        <button
          class="listings-page__load-button btn is-hidden"
          type="button"
          data-load-more-listings
        >
          Load More
        </button>
      </div>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <a class="site-footer__brand" href="index.html" aria-label="Bidsy home">
          <img class="site-footer__logo" src="/img/logo-2.svg" alt="Bidsy" />
        </a>

        <nav class="site-footer__links" aria-label="Footer navigation">
          <a class="site-footer__link" href="#">Terms Of Service</a>
          <a class="site-footer__link" href="#">Privacy Policy</a>
          <a class="site-footer__link" href="#">Auction Rules</a>
          <a class="site-footer__link" href="#">Contact Support</a>
        </nav>

        <p class="site-footer__copyright">2026 Bidsy</p>
      </div>
    </footer>
  </body>
</html>
