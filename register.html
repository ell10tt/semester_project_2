<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register | Bidsy</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="auth-page auth-page--with-header">
      <section class="auth-card" aria-labelledby="register-title">
        <h1 class="auth-card__title" id="register-title">Register a New Account</h1>

        <form class="auth-form">
          <div class="auth-form__group">
            <label class="form-label" for="register-name">Name:</label>
            <input class="form-control auth-form__input" id="register-name" type="text" />
          </div>

          <div class="auth-form__group">
            <label class="form-label" for="register-email">Email:</label>
            <input class="form-control auth-form__input" id="register-email" type="email" />
          </div>

          <div class="auth-form__group">
            <label class="form-label" for="register-password">Password:</label>
            <input
              class="form-control auth-form__input"
              id="register-password"
              type="password"
            />
          </div>

          <button class="btn auth-form__button" type="submit">Register</button>
        </form>

        <p class="auth-card__text">
          Already have an account?
          <a class="auth-card__link" href="login.html">Log in here</a>
        </p>
      </section>
    </main>
  </body>
</html>
