<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/img/logo-1.svg" />
    <title>Register | Bidsy</title>
    <script type="module" src="/js/index.js"></script>
  </head>
  <body data-page="register">
    <header class="site-header">
      <nav class="site-nav" aria-label="Main navigation">
        <a class="site-nav__brand" href="index.html" aria-label="Bidsy home">
          <img class="site-nav__logo" src="/img/logo-2.svg" alt="Bidsy" />
        </a>

        <div class="site-nav__links">
          <a class="site-nav__link site-nav__link--active" href="index.html">Home</a>
          <a class="site-nav__link" href="listings.html">Auctions</a>
        </div>

        <div class="site-nav__actions">
          <a
            class="site-nav__account-link"
            href="login.html"
            aria-label="Login"
            data-guest-only
          >
            <i class="bi bi-box-arrow-in-right"></i>
          </a>
          <a
            class="site-nav__account-link"
            href="register.html"
            aria-label="Register"
            data-guest-only
          >
            <i class="bi bi-person-plus"></i>
          </a>
          <span class="site-nav__credit-count" data-auth-only data-user-credits></span>
          <a class="site-nav__create" href="create-listing.html" data-auth-only>
            Create Listing
          </a>
          <button
            class="site-nav__icon-button"
            type="button"
            aria-label="Notifications"
            data-auth-only
          >
            <i class="bi bi-bell"></i>
          </button>
          <a
            class="site-nav__avatar"
            href="profile.html"
            aria-label="Profile"
            data-auth-only
            data-user-avatar
          >
            <i class="bi bi-person-fill"></i>
          </a>
          <button
            class="site-nav__logout-button"
            type="button"
            data-auth-only
            data-logout-button
          >
            Logout
          </button>
        </div>
      </nav>
    </header>

    <main class="auth-page">
      <section class="auth-card" aria-labelledby="register-title">
        <h1 class="auth-card__title" id="register-title">Register a New Account</h1>

        <div class="page-message" data-message></div>

        <form class="auth-form" id="register-form">
          <div class="auth-form__group">
            <label class="form-label" for="register-name">Name:</label>
            <input
              class="form-control auth-form__input"
              id="register-name"
              name="name"
              required
              type="text"
            />
          </div>

          <div class="auth-form__group">
            <label class="form-label" for="register-email">Email:</label>
            <input
              class="form-control auth-form__input"
              id="register-email"
              name="email"
              required
              type="email"
            />
          </div>

          <div class="auth-form__group">
            <label class="form-label" for="register-password">Password:</label>
            <input
              class="form-control auth-form__input"
              id="register-password"
              minlength="8"
              name="password"
              required
              type="password"
            />
          </div>

          <button class="btn auth-form__button" type="submit">Register</button>
        </form>

        <p class="auth-card__text">
          Already have an account?
          <a class="auth-card__link" href="login.html">Log in here</a>
        </p>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <a class="site-footer__brand" href="index.html" aria-label="Bidsy home">
          <img class="site-footer__logo" src="/img/logo-2.svg" alt="Bidsy" />
        </a>

        <nav class="site-footer__links" aria-label="Footer navigation">
          <a class="site-footer__link" href="#">Terms Of Service</a>
          <a class="site-footer__link" href="#">Privacy Policy</a>
          <a class="site-footer__link" href="#">Auction Rules</a>
          <a class="site-footer__link" href="#">Contact Support</a>
        </nav>

        <p class="site-footer__copyright">2026 Bidsy</p>
      </div>
    </footer>
  </body>
</html>
