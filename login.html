<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | Bidsy</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-card" aria-labelledby="login-title">
        <h1 class="auth-card__title" id="login-title">Login to Your Account</h1>

        <form class="auth-form">
          <div class="auth-form__group">
            <label class="form-label" for="login-email">Email:</label>
            <input class="form-control auth-form__input" id="login-email" type="email" />
          </div>

          <div class="auth-form__group">
            <label class="form-label" for="login-password">Password:</label>
            <input
              class="form-control auth-form__input"
              id="login-password"
              type="password"
            />
          </div>

          <button class="btn auth-form__button" type="submit">Login</button>
        </form>

        <p class="auth-card__text">
          Don't have an account?
          <a class="auth-card__link" href="register.html">Register here</a>
        </p>
      </section>
    </main>
  </body>
</html>
