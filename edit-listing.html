<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit Listing | Bidsy</title>
    <script type="module" src="/js/index.js"></script>
  </head>
  <body data-page="edit-listing" data-protected="true">
    <header class="site-header">
      <nav class="site-nav" aria-label="Main navigation">
        <a class="site-nav__brand" href="index.html" aria-label="Bidsy home">
          <img class="site-nav__logo" src="/img/logo-2.svg" alt="Bidsy" />
        </a>

        <div class="site-nav__links">
          <a class="site-nav__link" href="index.html">Home</a>
          <a class="site-nav__link site-nav__link--active" href="listings.html">
            Auctions
          </a>
        </div>

        <div class="site-nav__actions">
          <a class="site-nav__account-link" href="login.html" data-guest-only>Login</a>
          <a class="site-nav__account-link" href="register.html" data-guest-only>
            Register
          </a>
          <span class="site-nav__credit-count" data-auth-only data-user-credits></span>
          <a class="site-nav__create" href="create-listing.html" data-auth-only>
            Create Listing
          </a>
          <button
            class="site-nav__icon-button"
            type="button"
            aria-label="Notifications"
            data-auth-only
          >
            <i class="bi bi-bell"></i>
          </button>
          <a
            class="site-nav__avatar"
            href="profile.html"
            aria-label="Profile"
            data-auth-only
          >
            <i class="bi bi-person-fill"></i>
          </a>
          <button
            class="site-nav__logout-button"
            type="button"
            data-auth-only
            data-logout-button
          >
            Logout
          </button>
        </div>
      </nav>
    </header>

    <main class="edit-listing-page flex-grow-1 px-5 pt-5 pb-5">
      <div
        class="page-message edit-listing-page__message"
        data-edit-listing-message
      ></div>

      <form class="edit-listing" data-edit-listing-form>
        <div class="edit-listing__row d-flex align-items-center gap-4 mb-3">
          <label class="edit-listing__label" for="editListingTitle">Name:</label>
          <input
            class="form-control edit-listing__input"
            id="editListingTitle"
            name="title"
            type="text"
          />
        </div>

        <div class="edit-listing__image-box mb-4">
          <img
            class="edit-listing__image"
            src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=1200&q=80"
            alt=""
            data-edit-listing-image
          />
          <div class="edit-listing__image-shade"></div>
          <i class="bi bi-pencil edit-listing__image-icon"></i>
        </div>

        <div class="row row-cols-3 g-3 mb-4" aria-label="Listing photo preview">
          <div class="col">
            <img
              class="edit-listing__thumb w-100"
              src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=600&q=80"
              alt=""
              data-edit-listing-thumb
            />
          </div>
          <div class="col">
            <img
              class="edit-listing__thumb w-100"
              src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=600&q=80"
              alt=""
              data-edit-listing-thumb
            />
          </div>
          <div class="col">
            <div class="edit-listing__thumb-more position-relative overflow-hidden">
              <img
                class="edit-listing__thumb w-100"
                src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=600&q=80"
                alt=""
                data-edit-listing-thumb
              />
              <span
                class="edit-listing__thumb-text position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center"
              >
                Edit photo
              </span>
            </div>
          </div>
        </div>

        <div class="edit-listing__line mb-4"></div>

        <div class="edit-listing__row d-flex align-items-center gap-4 mb-4">
          <label class="edit-listing__label" for="editListingDescription">
            Description:
          </label>
          <input
            class="form-control edit-listing__description"
            id="editListingDescription"
            name="description"
            type="text"
          />
        </div>

        <div class="edit-listing__small-fields d-grid gap-3 mb-4">
          <div>
            <label class="form-label" for="editListingTags">Tags</label>
            <input
              class="form-control"
              id="editListingTags"
              name="tags"
              type="text"
              placeholder="camera, vintage"
            />
          </div>

          <div>
            <label class="form-label" for="editListingImageUrl">Image URL</label>
            <input
              class="form-control"
              id="editListingImageUrl"
              name="imageUrl"
              type="url"
              data-edit-listing-image-url
            />
          </div>
        </div>

        <div class="d-flex gap-3">
          <button class="edit-listing__button btn" type="submit" data-edit-listing-button>
            Save Changes
          </button>
          <a
            class="edit-listing__cancel btn"
            href="listings.html"
            data-edit-listing-cancel
          >
            Cancel
          </a>
        </div>
      </form>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <a class="site-footer__brand" href="index.html" aria-label="Bidsy home">
          <img class="site-footer__logo" src="/img/logo-2.svg" alt="Bidsy" />
        </a>

        <nav class="site-footer__links" aria-label="Footer navigation">
          <a class="site-footer__link" href="#">Terms Of Service</a>
          <a class="site-footer__link" href="#">Privacy Policy</a>
          <a class="site-footer__link" href="#">Auction Rules</a>
          <a class="site-footer__link" href="#">Contact Support</a>
        </nav>

        <p class="site-footer__copyright">2026 Bidsy</p>
      </div>
    </footer>
  </body>
</html>
