<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/img/logo-1.svg" />
    <title>Edit Profile | Bidsy</title>
    <script type="module" src="/js/index.js"></script>
  </head>
  <body data-page="edit-profile" data-protected="true">
    <header class="site-header">
      <nav class="site-nav" aria-label="Main navigation">
        <a class="site-nav__brand" href="index.html" aria-label="Bidsy home">
          <img class="site-nav__logo" src="/img/logo-2.svg" alt="Bidsy" />
        </a>

        <div class="site-nav__links">
          <a class="site-nav__link" href="index.html">Home</a>
          <a class="site-nav__link" href="listings.html">Auctions</a>
        </div>

        <div class="site-nav__actions">
          <a
            class="site-nav__account-link"
            href="login.html"
            aria-label="Login"
            data-guest-only
          >
            <i class="bi bi-box-arrow-in-right"></i>
          </a>
          <a
            class="site-nav__account-link"
            href="register.html"
            aria-label="Register"
            data-guest-only
          >
            <i class="bi bi-person-plus"></i>
          </a>
          <span class="site-nav__credit-count" data-auth-only data-user-credits></span>
          <a class="site-nav__create" href="create-listing.html" data-auth-only>
            Create Listing
          </a>
          <button
            class="site-nav__icon-button"
            type="button"
            aria-label="Notifications"
            data-auth-only
          >
            <i class="bi bi-bell"></i>
          </button>
          <a
            class="site-nav__avatar"
            href="profile.html"
            aria-label="Profile"
            data-auth-only
            data-user-avatar
          >
            <i class="bi bi-person-fill"></i>
          </a>
          <button
            class="site-nav__logout-button"
            type="button"
            data-auth-only
            data-logout-button
          >
            Logout
          </button>
        </div>
      </nav>
    </header>

    <main class="edit-profile-page flex-grow-1 px-4 px-lg-5 pt-5 pb-5">
      <div
        class="page-message edit-profile-page__message mx-auto"
        data-edit-profile-message
      ></div>

      <section
        class="edit-profile-header d-flex flex-column flex-md-row align-items-center justify-content-center gap-4 mb-5 text-center text-md-start"
      >
        <div class="edit-profile-header__avatar" data-edit-profile-avatar>
          <i class="bi bi-person-fill"></i>
        </div>

        <div>
          <h1 class="edit-profile-header__name" data-edit-profile-name>Edit Profile</h1>
          <p class="edit-profile-header__email" data-edit-profile-email></p>
          <p class="edit-profile-header__credits" data-edit-profile-credits>Credits: 0</p>
        </div>
      </section>

      <form class="edit-profile-form mx-auto" data-edit-profile-form>
        <div class="mb-4">
          <label class="edit-profile-form__label form-label" for="editProfileBio">
            Bio
          </label>
          <textarea
            class="edit-profile-form__textarea form-control"
            id="editProfileBio"
            name="bio"
            rows="4"
          ></textarea>
        </div>

        <div class="mb-4">
          <label class="edit-profile-form__label form-label" for="editProfileAvatarUrl">
            Avatar URL
          </label>
          <input
            class="edit-profile-form__input form-control"
            id="editProfileAvatarUrl"
            name="avatarUrl"
            type="url"
          />
        </div>

        <div class="mb-4">
          <label class="edit-profile-form__label form-label" for="editProfileAvatarAlt">
            Avatar alt text
          </label>
          <input
            class="edit-profile-form__input form-control"
            id="editProfileAvatarAlt"
            name="avatarAlt"
            type="text"
          />
        </div>

        <div class="mb-4">
          <label class="edit-profile-form__label form-label" for="editProfileBannerUrl">
            Banner URL
          </label>
          <input
            class="edit-profile-form__input form-control"
            id="editProfileBannerUrl"
            name="bannerUrl"
            type="url"
          />
        </div>

        <div class="mb-5">
          <label class="edit-profile-form__label form-label" for="editProfileBannerAlt">
            Banner alt text
          </label>
          <input
            class="edit-profile-form__input form-control"
            id="editProfileBannerAlt"
            name="bannerAlt"
            type="text"
          />
        </div>

        <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">
          <button
            class="edit-profile-form__button btn"
            type="submit"
            data-edit-profile-button
          >
            Confirm
          </button>
          <a class="edit-profile-form__cancel btn" href="profile.html">Cancel</a>
        </div>
      </form>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <a class="site-footer__brand" href="index.html" aria-label="Bidsy home">
          <img class="site-footer__logo" src="/img/logo-2.svg" alt="Bidsy" />
        </a>

        <nav class="site-footer__links" aria-label="Footer navigation">
          <a class="site-footer__link" href="#">Terms Of Service</a>
          <a class="site-footer__link" href="#">Privacy Policy</a>
          <a class="site-footer__link" href="#">Auction Rules</a>
          <a class="site-footer__link" href="#">Contact Support</a>
        </nav>

        <p class="site-footer__copyright">2026 Bidsy</p>
      </div>
    </footer>
  </body>
</html>
