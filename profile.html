<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profile | Bidsy</title>
    <script type="module" src="/js/index.js"></script>
  </head>
  <body data-page="profile" data-protected="true">
    <header class="site-header">
      <nav class="site-nav" aria-label="Main navigation">
        <a class="site-nav__brand" href="index.html" aria-label="Bidsy home">
          <img class="site-nav__logo" src="/img/logo-2.svg" alt="Bidsy" />
        </a>

        <div class="site-nav__links">
          <a class="site-nav__link site-nav__link--active" href="index.html">Home</a>
          <a class="site-nav__link" href="listings.html">Auctions</a>
        </div>

        <div class="site-nav__actions">
          <a class="site-nav__account-link" href="login.html" data-guest-only>Login</a>
          <a class="site-nav__account-link" href="register.html" data-guest-only
            >Register</a
          >
          <span class="site-nav__credit-count" data-auth-only data-user-credits></span>
          <a class="site-nav__create" href="create-listing.html" data-auth-only>
            Create Listing
          </a>
          <button
            class="site-nav__icon-button"
            type="button"
            aria-label="Notifications"
            data-auth-only
          >
            <i class="bi bi-bell"></i>
          </button>
          <a
            class="site-nav__avatar"
            href="profile.html"
            aria-label="Profile"
            data-auth-only
          >
            <i class="bi bi-person-fill"></i>
          </a>
          <button
            class="site-nav__logout-button"
            type="button"
            data-auth-only
            data-logout-button
          >
            Logout
          </button>
        </div>
      </nav>
    </header>

    <main class="profile-page">
      <div class="page-message profile-page__message" data-message></div>

      <section class="profile-header">
        <div class="profile-header__avatar" data-profile-avatar>
          <i class="bi bi-person-fill"></i>
        </div>

        <div class="profile-header__info">
          <h1 class="profile-header__name" data-profile-name>John Doe</h1>
          <p class="profile-header__credits" data-profile-credits>Credits: 0</p>
          <a class="profile-header__button" href="#">
            <i class="bi bi-pencil"></i>
            Edit Profile
          </a>
        </div>
      </section>

      <section class="profile-tabs" aria-label="Profile sections">
        <button class="profile-tabs__button profile-tabs__button--active" type="button">
          My Bids
        </button>
        <button class="profile-tabs__button" type="button">My Listings</button>
        <button class="profile-tabs__button" type="button">Won Items</button>
      </section>

      <section class="profile-items" aria-label="Profile listings">
        <article class="listing-card">
          <img
            class="listing-card__image"
            src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=900&q=80"
            alt="Vintage Canon camera"
          />
          <div class="listing-card__body">
            <div class="listing-card__header">
              <h2 class="listing-card__title">Camera Canon</h2>
              <button
                class="listing-card__favorite"
                type="button"
                aria-label="Add to favourites"
              >
                <i class="bi bi-heart"></i>
              </button>
            </div>
            <p class="listing-card__text">
              Old camera Canon. Make cool and atmospheric photos
            </p>
            <div class="listing-card__line"></div>
            <div class="listing-card__meta">
              <p>
                <strong>Current Bid:</strong>
                <span class="listing-card__price">$200</span>
              </p>
              <p>
                <strong>Time left:</strong>
                <span class="listing-card__time">02:14:30</span>
              </p>
            </div>
          </div>
        </article>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <a class="site-footer__brand" href="index.html" aria-label="Bidsy home">
          <img class="site-footer__logo" src="/img/logo-2.svg" alt="Bidsy" />
        </a>

        <nav class="site-footer__links" aria-label="Footer navigation">
          <a class="site-footer__link" href="#">Terms Of Service</a>
          <a class="site-footer__link" href="#">Privacy Policy</a>
          <a class="site-footer__link" href="#">Auction Rules</a>
          <a class="site-footer__link" href="#">Contact Support</a>
        </nav>

        <p class="site-footer__copyright">2026 Bidsy</p>
      </div>
    </footer>
  </body>
</html>
