<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profile | Bidsy</title>
    <script type="module" src="/js/index.js"></script>
  </head>
  <body data-page="profile" data-protected="true">
    <header class="site-header">
      <nav class="site-nav" aria-label="Main navigation">
        <a class="site-nav__brand" href="index.html" aria-label="Bidsy home">
          <img class="site-nav__logo" src="/img/logo-2.svg" alt="Bidsy" />
        </a>

        <div class="site-nav__links">
          <a class="site-nav__link site-nav__link--active" href="index.html">Home</a>
          <a class="site-nav__link" href="listings.html">Auctions</a>
        </div>

        <div class="site-nav__actions">
          <a class="site-nav__account-link" href="login.html" data-guest-only>Login</a>
          <a class="site-nav__account-link" href="register.html" data-guest-only
            >Register</a
          >
          <span class="site-nav__credit-count" data-auth-only data-user-credits></span>
          <a class="site-nav__create" href="create-listing.html" data-auth-only>
            Create Listing
          </a>
          <button
            class="site-nav__icon-button"
            type="button"
            aria-label="Notifications"
            data-auth-only
          >
            <i class="bi bi-bell"></i>
          </button>
          <a
            class="site-nav__avatar"
            href="profile.html"
            aria-label="Profile"
            data-auth-only
          >
            <i class="bi bi-person-fill"></i>
          </a>
          <button
            class="site-nav__logout-button"
            type="button"
            data-auth-only
            data-logout-button
          >
            Logout
          </button>
        </div>
      </nav>
    </header>

    <main class="profile-page">
      <div class="page-message profile-page__message" data-message></div>

      <section class="profile-banner mb-4" data-profile-banner>
        <div class="profile-banner__overlay"></div>
      </section>

      <section class="profile-header">
        <div class="profile-header__avatar" data-profile-avatar>
          <i class="bi bi-person-fill"></i>
        </div>

        <div class="profile-header__info">
          <h1 class="profile-header__name" data-profile-name>John Doe</h1>
          <p class="profile-header__email" data-profile-email></p>
          <p class="profile-header__credits" data-profile-credits>Credits: 0</p>
          <p class="profile-header__bio" data-profile-bio>No bio yet.</p>
          <a class="profile-header__button" href="edit-profile.html">
            <i class="bi bi-pencil"></i>
            Edit Profile
          </a>
        </div>
      </section>

      <section class="profile-stats mb-5" aria-label="Profile stats">
        <p class="profile-stats__item">
          <strong data-profile-listing-count>0</strong>
          Listings
        </p>
        <p class="profile-stats__item">
          <strong data-profile-bid-count>0</strong>
          Bids
        </p>
        <p class="profile-stats__item">
          <strong data-profile-win-count>0</strong>
          Wins
        </p>
      </section>

      <section class="profile-section mb-5" aria-labelledby="profile-listings-title">
        <h2 class="profile-section__title" id="profile-listings-title">My Listings</h2>
        <div
          class="profile-items row row-cols-3 g-4"
          data-profile-listings
          aria-label="Created listings"
        ></div>
      </section>

      <section class="profile-section mb-5" aria-labelledby="profile-bids-title">
        <h2 class="profile-section__title" id="profile-bids-title">My Bids</h2>
        <div
          class="profile-items row row-cols-3 g-4"
          data-profile-bids
          aria-label="Listings user bid on"
        ></div>
      </section>

      <section class="profile-section" aria-labelledby="profile-wins-title">
        <h2 class="profile-section__title" id="profile-wins-title">Won Items</h2>
        <div
          class="profile-items row row-cols-3 g-4"
          data-profile-wins
          aria-label="Won listings"
        ></div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <a class="site-footer__brand" href="index.html" aria-label="Bidsy home">
          <img class="site-footer__logo" src="/img/logo-2.svg" alt="Bidsy" />
        </a>

        <nav class="site-footer__links" aria-label="Footer navigation">
          <a class="site-footer__link" href="#">Terms Of Service</a>
          <a class="site-footer__link" href="#">Privacy Policy</a>
          <a class="site-footer__link" href="#">Auction Rules</a>
          <a class="site-footer__link" href="#">Contact Support</a>
        </nav>

        <p class="site-footer__copyright">2026 Bidsy</p>
      </div>
    </footer>
  </body>
</html>
